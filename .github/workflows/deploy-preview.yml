name: Frontend Preview Deployment

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - main

env:
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
  SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_REGION: fr-par
  BUCKET_NAME: skillquest-previews

jobs:
  setup-tools:
    runs-on: ubuntu-latest
    outputs:
      aws_cli_path: /usr/local/bin/aws
      scw_cli_path: /usr/bin/scw
    steps:
      - name: Install Scaleway CLI
        run: |
          curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
          sudo mv /usr/local/bin/scw /usr/bin/scw

      - name: Test Scaleway CLI
        run: scw version

      - name: Check preinstalled AWS CLI version
        run: aws --version

  deploy-preview:
    runs-on: ubuntu-latest
    needs: setup-tools
    if: github.event.action != 'closed'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          export VITE_API_URL=https://api.skillquest.com
          export VITE_APP_ENV=preview
          npm run build

      - name: Create global preview bucket
        run: |
          scw object bucket create name=$BUCKET_NAME region=fr-par
          scw object bucket website set bucket=$BUCKET_NAME index-document=index.html error-document=404.html

      - name: Deploy PR preview to bucket
        run: |
          PREVIEW_PATH="pr-${{ github.event.number }}/"
          aws s3 cp dist/ s3://$BUCKET_NAME/$PREVIEW_PATH --recursive \
            --endpoint-url https://s3.fr-par.scw.cloud
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://skillquest-previews.s3-website.fr-par.scw.cloud/pr-${prNumber}/index.html`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview déployée !**\n\n📱 Frontend: ${previewUrl}\n🔗 Backend: https://api.skillquest.com (stable)\n\n_Cette preview sera supprimée automatiquement à la fermeture de la PR._`
            });

  cleanup-preview:
    runs-on: ubuntu-latest
    needs: setup-tools
    if: github.event.action == 'closed'
    steps:
      - name: Delete PR preview folder
        run: |
          PREVIEW_PATH="pr-${{ github.event.number }}/"
          aws s3 rm s3://$BUCKET_NAME/$PREVIEW_PATH --recursive \
            --endpoint-url https://s3.fr-par.scw.cloud
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
